<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schematic</title>
    <link rel="stylesheet" href="/styles/page.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="logo">schematic</span>
      <span id="select-wrap">
        <button id="tool-select" class="tool" title="Select (V) — click corner for rect/lasso">
          <svg id="select-icon-rect" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="17" rx="1" />
          </svg>
          <svg id="select-icon-lasso" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2" aria-hidden="true" style="display:none">
            <path d="M12 3 C7 3 3.5 6 3.5 9.5 C3.5 14 7.5 17 12 17 C16.5 17 20.5 14 20.5 9.5 C20.5 5.5 16.5 3 12 3 Z" />
            <path d="M15.5 16 L18 19.5" stroke-dasharray="none" />
          </svg>
          <svg id="select-corner" viewBox="0 0 8 8" width="7" height="7" fill="currentColor" aria-hidden="true">
            <path d="M1 8 L8 8 L8 1 Z" />
          </svg>
        </button>
        <div id="select-menu" hidden>
          <button data-mode="rect">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 2" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="1" />
            </svg>
            Rectangle
          </button>
          <button data-mode="lasso">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 2" aria-hidden="true">
              <path d="M12 3 C7 3 4 6 4 9.5 C4 14 8 17 12 17 C16.5 17 20 14 20 9.5 C20 5.5 16.5 3 12 3 Z" />
              <path d="M15.5 16.5 L18 20" stroke-dasharray="none" />
            </svg>
            Lasso
          </button>
        </div>
      </span>
      <button id="tool-bond" class="tool active" title="Bond tool (draw single bonds)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="18" x2="20" y2="6" />
        </svg>
      </button>
      <button id="tool-chain" class="tool" title="Chain tool (drag out zigzag chains)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="2 17 8 7 13 17 18 7 22 13" />
        </svg>
      </button>
      <button id="tool-ring" class="tool" title="Ring tool — hover and press 3–8 to place (6 = benzene)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="21,12 16.5,19.8 7.5,19.8 3,12 7.5,4.2 16.5,4.2" />
        </svg>
      </button>
      <button id="tool-arrow" class="tool" title="Reaction arrow (drag to draw, snapped to 45°)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>
      <button id="tool-plus" class="tool" title="Plus sign (click to place)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <button id="tool-viewport" class="tool" title="Pan/zoom (drag to pan, scroll to zoom, Ctrl+0 to fit)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 11V6a2 2 0 0 0-4 0v5" />
          <path d="M14 10V4a2 2 0 0 0-4 0v6" />
          <path d="M10 10.5V3a2 2 0 0 0-4 0v9" />
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
        </svg>
      </button>
      <span class="spacer"></span>
      <button id="undo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
      </button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
      </button>
      <span id="export-wrap">
        <button id="export" title="Export — copy/download SVG or PNG">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>
        <div id="export-menu" hidden>
          <button data-export="copy-png">Copy PNG</button>
          <button data-export="download-svg">Download SVG</button>
          <button data-export="download-png">Download PNG</button>
        </div>
      </span>
    </header>
    <main id="canvas-host"></main>
    <footer id="statusline">draw: drag to bond · click a bond to cycle order · paste SMILES with ⌘V</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
