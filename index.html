<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schematic</title>
    <link rel="stylesheet" href="/styles/page.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="logo">schematic</span>
      <button id="tool-bond" class="tool active" title="Bond tool (draw single bonds)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="18" x2="20" y2="6" />
        </svg>
      </button>
      <button id="tool-select" class="tool" title="Select (marquee, move, delete)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="1" />
        </svg>
      </button>
      <button id="tool-chain" class="tool" title="Chain tool (drag out zigzag chains)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="2 17 8 7 13 17 18 7 22 13" />
        </svg>
      </button>
      <span class="spacer"></span>
      <button id="undo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
      </button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
      </button>
    </header>
    <main id="canvas-host"></main>
    <footer id="statusline">draw: drag to bond · click a bond to cycle order · 1/2/3 over a bond sets order</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
