<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schematic</title>
    <link rel="stylesheet" href="/styles/page.css" />
  </head>
  <body>
    <header id="toolbar">
      <span id="logo">schematic</span>
      <span class="spacer"></span>
      <button id="undo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6.5a5.2 5.2 0 1 1-0.4 5" />
          <polyline points="2.6 2.2 3 6.5 7.2 6.3" />
        </svg>
      </button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 6.5a5.2 5.2 0 1 0 0.4 5" />
          <polyline points="13.4 2.2 13 6.5 8.8 6.3" />
        </svg>
      </button>
    </header>
    <main id="canvas-host"></main>
    <footer id="statusline">draw: drag to bond · click a bond to cycle order · 1/2/3 over a bond sets order</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
